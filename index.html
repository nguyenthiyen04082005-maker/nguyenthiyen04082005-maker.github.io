<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="응웬 티 이엔의 개인 홈페이지입니다.">
  <title>응웬 티 이엔 | 개인 홈페이지</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f4ef;
      --ink: #202722;
      --muted: #68736c;
      --green: #315d49;
      --line: rgba(32, 39, 34, .14);
      --serif: Georgia, "Times New Roman", serif;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 12%, rgba(213, 221, 201, .58), transparent 34rem),
        var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    a { color: inherit; }

    .shell {
      width: min(1120px, calc(100% - 48px));
      margin-inline: auto;
    }

    .topbar {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      text-decoration: none;
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    nav { display: flex; gap: 28px; }

    nav a {
      color: var(--muted);
      font-size: .88rem;
      text-decoration: none;
      transition: color .2s ease;
    }

    nav a:hover, nav a:focus-visible { color: var(--green); }

    main { padding-bottom: 88px; }

    .hero {
      min-height: 590px;
      display: grid;
      align-content: center;
      padding-block: 100px;
      position: relative;
    }

    .eyebrow {
      color: var(--green);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 24px 0 20px;
      font-family: var(--serif);
      font-size: clamp(3.7rem, 10vw, 8rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .98;
    }

    .hero-copy {
      max-width: 510px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.9;
      word-break: keep-all;
    }

    .hero-mark {
      width: clamp(120px, 21vw, 250px);
      aspect-ratio: 1;
      position: absolute;
      right: 4%;
      bottom: 11%;
      border: 1px solid rgba(49, 93, 73, .26);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green);
      font-family: var(--serif);
      font-size: clamp(2.6rem, 7vw, 5rem);
      transform: rotate(-12deg);
    }

    .hero-mark::before, .hero-mark::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(49, 93, 73, .18);
      border-radius: 50%;
    }

    .hero-mark::after {
      inset: 24px;
      border-style: dashed;
    }

    .section {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      padding-block: 42px;
      border-top: 1px solid var(--line);
    }

    .section-label {
      margin: 5px 0 0;
      color: var(--green);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .section-content { max-width: 650px; }

    h2 {
      margin: 0 0 16px;
      font-family: var(--serif);
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .section-content p {
      margin: 0;
      color: var(--muted);
      line-height: 1.9;
      word-break: keep-all;
    }

    .link-card {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green);
      font-size: .9rem;
      font-weight: 650;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease;
    }

    .link-card:hover, .link-card:focus-visible {
      background: rgba(49, 93, 73, .07);
      border-color: rgba(49, 93, 73, .4);
    }

    .arrow { font-size: 1.05rem; }

    footer {
      border-top: 1px solid var(--line);
      padding-block: 24px 36px;
      color: var(--muted);
      font-size: .8rem;
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 36px, 1120px); }
      .topbar { min-height: 72px; }
      nav { gap: 16px; }
      nav a { font-size: .8rem; }
      .hero { min-height: 560px; padding-block: 84px; }
      .hero-mark { right: 2%; bottom: 6%; opacity: .72; }
      .section { grid-template-columns: 1fr; gap: 16px; padding-block: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="#home">응웬 티 이엔</a>
      <nav aria-label="주요 메뉴">
        <a href="#about">소개</a>
        <a href="#links">링크</a>
      </nav>
    </header>

    <main id="home">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Personal homepage</p>
        <h1 id="page-title">응웬 티 이엔</h1>
        <p class="hero-copy">안녕하세요. 이곳은 저를 소개하고, 관심 있는 것과 만들어가는 작업을 차근차근 기록하는 개인 홈페이지입니다.</p>
        <div class="hero-mark" aria-hidden="true">Y</div>
      </section>

      <section class="section" id="about" aria-labelledby="about-title">
        <p class="section-label">01 / About</p>
        <div class="section-content">
          <h2 id="about-title">저에 대해</h2>
          <p>이 페이지를 찾아주셔서 감사합니다. 새로운 소식과 작업을 이곳에 조금씩 모아갈게요.</p>
        </div>
      </section>

      <section class="section" id="links" aria-labelledby="links-title">
        <p class="section-label">02 / Around the web</p>
        <div class="section-content">
          <h2 id="links-title">다른 곳에서 만나요</h2>
          <p>코드와 프로젝트는 GitHub에서 확인할 수 있습니다.</p>
          <a class="link-card" href="https://github.com/nguyenthiyen04082005-maker" target="_blank" rel="noopener noreferrer">
            GitHub 프로필 <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>

    <footer>© <span id="year">2026</span> 응웬 티 이엔</footer>
  </div>
</body>
</html>
